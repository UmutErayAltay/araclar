[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orkestra"
version = "0.1.0"
description = "Ajan Orkestrasi — gorev kuyrugu, calistirici, web paneli ve kota"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[project.scripts]
orkestra = "orkestra.cli:main"

[tool.setuptools]
packages = ["orkestra", "orkestra.web"]

[tool.setuptools.package-data]
"orkestra.web" = ["sablonlar/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: Playwright ile gercek tarayici/sunucu testleri (yavas)",
]