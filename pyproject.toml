[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Repo Saglik Atlasi - yerel git repolarini tarayan salt-okunur CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools]
packages = ["atlas"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
