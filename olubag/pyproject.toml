[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olubag"
version = "0.1.0"
description = "Projelerde bildirilip hic kullanilmayan bagimliliklari (Python/JS) tarayan salt-okunur CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
olubag = "olubag.cli:main"

[tool.setuptools]
packages = ["olubag"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]