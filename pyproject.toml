[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harita"
version = "0.1.0"
description = "Markdown vault'unu okuyup not grafiğini indeksleyen salt-okunur araç"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harita = "harita.cli:main"

[tool.setuptools]
packages = ["harita"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
