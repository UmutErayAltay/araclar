[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maske"
version = "0.1.0"
description = "Dosyalardaki secret'lar (API key/token/parola/ozel anahtar) bulup yerinde maskeleyen CLI (varsayilan: kuru calistirma)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
maske = "maske.cli:main"

[tool.setuptools]
packages = ["maske"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]