[project]
name = "danis"
version = "0.1.0"
description = "Terminal hata asistanı + 'bu dosyayı cor'a sor'"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0", "python-docx>=1.1"]

[project.scripts]
danis = "danis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["danis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: gerçek cor proxy'sine (127.0.0.1:8787) karşı çalışır",
]
# `addopts` ile integration dışlanMAZ: cor bu container'da gerçekten
# çalışıyor ve varsayılan koşuda doğrulanması istendi. cor'un kapalı olduğu
# bir ortamda: `python3 -m pytest -m "not integration"`.
