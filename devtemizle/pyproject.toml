[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devtemizle"
version = "0.1.0"
description = "Repolardaki node_modules/__pycache__/sanal ortam klasorlerini tarayip yasina gore temizleyen CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
devtemizle = "devtemizle.cli:main"

[tool.setuptools]
packages = ["devtemizle"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]