[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mezar"
version = "0.1.0"
description = "Bosaltilmis ('mezar tasi') repolari silmeden once denetleyen salt okunur CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mezar = "mezar.cli:main"

[tool.setuptools]
packages = ["mezar"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
