[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yol"
version = "0.1.0"
description = "PATH ve ortam değişkeni düzenleyici"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["Flask>=3.0"]
dev = ["pytest"]

[project.scripts]
yol = "yol.cli:main"

[tool.setuptools]
packages = ["yol"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]