<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ne İzlesem / Okusam</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>🎬 Ne İzlesem / Okusam</h1>
  </header>

  <form id="add-form" class="add-form">
    <input type="text" id="add-title" placeholder="Başlık ekle…" required autocomplete="off">
    <select id="add-kind">
      <option value="film">Film</option>
      <option value="dizi">Dizi</option>
      <option value="anime">Anime</option>
      <option value="kitap">Kitap</option>
    </select>
    <select id="add-status">
      <option value="planlanan">Planlanan</option>
      <option value="izleniyor">İzleniyor</option>
      <option value="tamamlandi">Tamamlandı</option>
      <option value="birakildi">Bırakıldı</option>
    </select>
    <button type="submit">Ekle</button>
  </form>

  <div class="controls">
    <input type="search" id="search" placeholder="Ara…" autocomplete="off">
    <div class="chip-row" id="kind-chips" data-filter="kind">
      <button class="chip active" data-value="">Hepsi</button>
      <button class="chip" data-value="film">Film</button>
      <button class="chip" data-value="dizi">Dizi</button>
      <button class="chip" data-value="anime">Anime</button>
      <button class="chip" data-value="kitap">Kitap</button>
    </div>
    <div class="chip-row" id="status-chips" data-filter="status">
      <button class="chip active" data-value="">Hepsi</button>
      <button class="chip" data-value="planlanan">Planlanan</button>
      <button class="chip" data-value="izleniyor">İzleniyor</button>
      <button class="chip" data-value="tamamlandi">Tamamlandı</button>
      <button class="chip" data-value="birakildi">Bırakıldı</button>
    </div>
  </div>

  <main id="grid" class="grid" aria-live="polite"></main>
  <p id="empty-state" class="empty-state hidden">Henüz bir şey eklemedin.</p>
</div>

<div id="toast" class="toast hidden" role="status"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
