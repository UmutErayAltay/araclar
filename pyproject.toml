[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisayol"
version = "0.1.0"
description = "Terminalden fuzzy-search ile sık kullanılan proje/komut paleti"
requires-python = ">=3.11"
dependencies = [
    "questionary",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
kp = "kisayol.cli:main"

[tool.setuptools.packages.find]
include = ["kisayol*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
