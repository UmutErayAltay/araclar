[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servis"
version = "0.1.0"
description = "Yerel servis yiginini (cor, kule, liman, readbunny-postgres) tek komutla baslatip durduran ve durumunu gosteren CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
servis = "servis.cli:main"

[tool.setuptools]
packages = ["servis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]