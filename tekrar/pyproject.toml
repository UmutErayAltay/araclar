[project]
name = "tekrar"
version = "0.1.0"
description = "Vault bilgi notlarından aralıklı tekrar kartları: cor ile üret, Leitner aralığıyla Telegram'a gönder"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tekrar = "tekrar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tekrar"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: gerçek ağ/cor çağrısı yapan testler (varsayılan koşuda atlanır)",
]
addopts = "-m \"not integration\""
