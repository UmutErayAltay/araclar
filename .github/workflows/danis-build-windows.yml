name: danis — Build Windows

# corclient monorepo'sunda danis/ klasörü için. Tetikleyici yalnız danis/ veya
# ortak istemci kaynağı değişince çalışır; komutlar danis/ içinde koşar.
# Bu workflow YALNIZCA Windows'ta gerçekten koşar; Linux'ta PyInstaller
# bir .exe üretmez. Doğrulama durumu GitHub → Actions sekmesinden görülür.
on:
  push:
    branches: [main]
    paths: ['danis/**', 'corclient.py', '.github/workflows/danis-build-windows.yml']
  pull_request:
    paths: ['danis/**', 'corclient.py', '.github/workflows/danis-build-windows.yml']

defaults:
  run:
    working-directory: danis

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      # PyInstaller'a `danis` paketinin kendisini de veriyoruz: cli.py
      # `from danis.hata_analiz import ...` diye İÇE aktarım yapıyor, sadece
      # script yolunu vermek modüleri bulamıyor (hidden-import hatası).
      - name: Build (tek dosya)
        run: pyinstaller --onefile --name danis --paths . danis/cli.py

      - name: Smoke test
        run: |
          # Kurulum çökmüşse artifact'ı yayınlamadan yakalayalım: --help
          # cor'a dokunmaz, ama giriş noktasının ve bağımlılıkların
          # paketlendiğini gerçekten kanıtlar.
          .\dist\danis.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: danis-win
          path: danis/dist/danis.exe
          if-no-files-found: error
