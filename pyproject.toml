[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orkestra"
version = "0.1.0"
description = "Ajan Orkestrasi — gorev kuyrugu ve CLI (Dalga A)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orkestra = "orkestra.cli:main"

[tool.setuptools]
packages = ["orkestra"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"